[project]
name = "hp-mcp-autocad"
version = "3.2.0+hp.2"
description = "HP MCP AutoCAD: MCP server điều khiển AutoCAD cho Claude, có chốt an toàn không xóa, không ghi đè bản vẽ. Sửa đổi từ vn-autocad-claude / autocad-mcp (MIT)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nguyen Huu Phuc" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.1,<2.0",
    "ezdxf>=0.18",
    "matplotlib>=3.7",
    "Pillow>=10.0.0",
    "structlog>=24.0.0",
    "pywin32>=305; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
